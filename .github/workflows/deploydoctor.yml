name: DeployDoctor
on:
  pull_request:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  deploydoctor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub proves which public repo is asking; no token needed
    steps:
      - uses: actions/checkout@v4
      # This repository dogfoods the Action from its own source, so a change to it is tested on the PR that makes it.
      - uses: ./action

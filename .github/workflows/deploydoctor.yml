name: DeployDoctor
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  deploydoctor:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub proves which public repo is asking; no token needed
    steps:
      - uses: actions/checkout@v4
      # This repository dogfoods the Action from its own source, so a change to it is tested on the PR that makes it.
      # The free allowance is one scan a day per repository, so any second run in a UTC day (a later push to the same PR,
      # a reopen or another PR) gets the used-quota answer: the step writes it to the job summary, warns and passes.
      # Do not set quota-exhausted: fail here; it would make this check red on most pull requests.
      - uses: ./action

name: Prune completed branches
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/prune-completed-branches.yml]
  pull_request:
    types: [closed]
permissions:
  contents: read
concurrency:
  group: prune-completed-branches
  cancel-in-progress: false
jobs:
  prune:
    if: github.event_name != 'pull_request' || (github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete only verified completed branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          MERGED_PR: ${{ github.event.pull_request.number }}

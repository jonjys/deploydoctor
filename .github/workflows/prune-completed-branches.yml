          const repo = process.env.REPOSITORY;
          if (repo !== 'jonjys/deploydoctor') throw new Error('Unexpected repository');
          async function api(path, method = 'GET') {
            const response = await fetch('https://api.github.com/repos/' + repo + path, {
              method, redirect: 'error',
              headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' },
              signal: AbortSignal.timeout(15000),
            });
            if (response.status === 404) return null;
            if (!response.ok) throw new Error('GitHub returned ' + response.status);
            return response.status === 204 ? true : response.json();
          }
          const info = await api('');
          const candidates = process.env.MERGED_PR ? [] : [...initial];
          if (process.env.MERGED_PR) {
            const pr = await api('/pulls/' + process.env.MERGED_PR);
            if (pr?.merged && pr.head.repo.full_name === repo && !candidates.some(item => item.name === pr.head.ref)) {
              candidates.push({ name: pr.head.ref, sha: pr.head.sha, pr: pr.number, ancestor: false });
            }
          }
          const results = [];
          for (const item of candidates) {
            if (item.name === info.default_branch || item.name === 'master' || item.name === 'main') continue;
            const refPath = '/git/ref/heads/' + encodeURIComponent(item.name);
            const branch = await api(refPath);
            if (!branch) continue;
            if (branch.object.sha !== item.sha) { results.push(item.name + ': kept (tip changed)'); continue; }
            const open = await api('/pulls?state=open&head=' + encodeURIComponent(repo.split('/')[0] + ':' + item.name));
            if (open?.length) { results.push(item.name + ': kept (open PR)'); continue; }
            let complete = false;
            if (item.pr) {
              const pr = await api('/pulls/' + item.pr);
              complete = pr?.merged === true && pr.head.sha === item.sha && pr.head.ref === item.name && pr.base.ref === info.default_branch;
            }
            if (!complete) {
              const compare = await api('/compare/' + encodeURIComponent(info.default_branch) + '...' + item.sha);
              complete = compare && ['behind', 'identical'].includes(compare.status);
            }
            if (!complete) { results.push(item.name + ': kept (unmerged work)'); continue; }
            // Re-read immediately before deletion. A moved branch is never deliberately removed.
            const current = await api(refPath);
            if (!current || current.object.sha !== item.sha) { results.push(item.name + ': kept (tip changed)'); continue; }
            await api('/git/refs/heads/' + encodeURIComponent(item.name), 'DELETE');
            results.push(item.name + ': deleted');
          }
          console.log(results.join('\n'));
